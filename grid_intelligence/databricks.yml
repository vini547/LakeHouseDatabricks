# This is a Declarative Automation Bundle definition for grid_intelligence.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: grid_intelligence
  uuid: e31bba0a-4636-4d43-8dd4-985717f89138

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

experimental:
  # Sem isto, em mode: development o bundle prefixa os schemas com o nome do usuario.
  # O isolamento entre dev e prod e feito pelo catalogo, nao pelo nome do schema.
  skip_name_prefix_for_schema: true

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  # Id de um Serverless Starter Warehouse; jobs que nao rodam em serverless de pipeline (sql_task)
  # precisam de warehouse. Prod pode ter o seu; por ora ambos usam o mesmo.
  warehouse_id:
    description: The SQL warehouse to use for SQL tasks

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-841b4777-0cbc.cloud.databricks.com
    variables:
      catalog: grid_dev
      warehouse_id: 955067506c83b4e8
  prod:
    mode: production
    workspace:
      host: https://dbc-841b4777-0cbc.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/carlosengineering547@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/carlosengineering547@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
      warehouse_id: 955067506c83b4e8
    permissions:
      - user_name: carlosengineering547@gmail.com
        level: CAN_MANAGE
